[package]
name = "dtap-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
dtap-core = { path = "../dtap-core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
